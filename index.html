<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Three backers deposit at one mint and pay a creator in one payment, or not at all." />
    <title>All Together</title>
    <script>
      // Set the theme before first paint: a saved choice wins, then the system setting.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (error) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
