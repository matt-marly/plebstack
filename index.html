<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plebstack: crowdfunding on Cashu ecash. Three plebs stack 21 sats each and pay one maintainer together, or not at all. The organizer never holds your key." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Plebstack</title>
    <script>
      // Set the theme before first paint: a saved choice wins, then a system request for light; night otherwise.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (error) {}
        var light = saved ? saved === 'light' : matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
